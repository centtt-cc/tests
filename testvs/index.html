
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ANIMASI HUJAN -->
    <div class="rain"></div>

    <!-- HALAMAN PEMBUKA -->
    <div class="welcome-screen" id="welcomeScreen">

        <div class="welcome-content">

            <div class="welcome-heart">❤️</div>

            <h1>Hey, You!</h1>

            <p class="welcome-text">
                Someone has something special for you...
            </p>

            <p class="welcome-subtitle">
                A little surprise, just for you Carissa ❤️
            </p>

            <button type="button" id="openButton">
                BUKA SURAT ❤️
            </button>

            <p class="welcome-footer">
                Made with love, just for you.
            </p>

        </div>

    </div>

    <!-- KONTEN KARTU CINTA -->
    <div class="love-content" id="loveContent">

        <div class="card">

            <div class="heart">❤️</div>

            <h1>I Love You</h1>

            <p class="subtitle">
                No Matter What,
            </p>

            <p class="message">
                My heart will always choose you.
                <br>
                You are my favorite person
                <br>
                ❤️Carissa❤️
            </p>

            <div class="bottom-heart">
                ♥ ♥ ♥
            </div>

            <p class="footer">
                Forever & Always
            </p>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        // MEMBUAT ANIMASI HUJAN
        const rain = document.querySelector('.rain');

        for (let i = 0; i < 100; i++) {

            const drop = document.createElement('span');

            drop.classList.add('drop');

            drop.style.left = Math.random() * 100 + '%';

            drop.style.animationDuration =
                (0.5 + Math.random() * 1.5) + 's';

            drop.style.animationDelay =
                Math.random() * 3 + 's';

            rain.appendChild(drop);
        }


        // TOMBOL BUKA SURAT
        const openButton =
            document.getElementById('openButton');

        const welcomeScreen =
            document.getElementById('welcomeScreen');

        const loveContent =
            document.getElementById('loveContent');


        openButton.addEventListener('click', function () {

            // Hilangkan halaman pembuka
            welcomeScreen.classList.add('hide');

            // Tampilkan kartu cinta
            setTimeout(function () {

                welcomeScreen.style.display = 'none';

                loveContent.classList.add('show');

            }, 1000);

        });

    </script>

</body>
</html>
